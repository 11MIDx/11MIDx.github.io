<!DOCTYPE html>
<html lang="az">
<head>
<meta name="google-site-verification" content="hWI9JTzJS9M8SbMfd-1oRRcM1X1bAHBEfjEB6a2jXLs">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>11MIDx - Ümid Hacılı</title>
<meta name="description" content="11MIDx - Ümid Hacılı tərəfindən hazırlanmış şəxsi veb sayt.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://11midx.github.io/">

<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
body{display:flex;justify-content:center;align-items:center;color:#fff;font-family:Arial,sans-serif}
#fireworks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.screen{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;z-index:5;transition:opacity .4s ease}
.screen.hidden{opacity:0;pointer-events:none}
.container{text-align:center}
h1{margin:0 0 25px;font-size:50px;font-weight:600;color:#fff;user-select:none;-webkit-user-select:none;-moz-user-select:none}
.start-button{width:140px;height:54px;margin:auto;padding:0;border:1px solid #292929;border-radius:15px;background:#000;display:flex;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 0 18px rgba(255,255,255,.28),0 0 38px rgba(255,255,255,.12);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;user-select:none;-webkit-user-select:none}
.start-button:hover{transform:scale(1.04);border-color:#555;box-shadow:0 0 25px rgba(255,255,255,.5),0 0 50px rgba(255,255,255,.18)}
.start-button span{width:0;height:0;margin-left:5px;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:20px solid #fff;filter:drop-shadow(0 0 2px #fff)}
.second-screen{width:100%;height:100%;display:flex;justify-content:center;align-items:center}
.back-button{position:fixed;top:25px;left:25px;padding:10px 18px;border:1px solid #333;border-radius:10px;background:#000;color:#fff;font-size:15px;cursor:pointer;box-shadow:0 0 15px rgba(255,255,255,.15);transition:.2s;user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
.back-button:hover{border-color:#666;box-shadow:0 0 20px rgba(255,255,255,.3)}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="screen" id="firstScreen">
<div class="container">
<h1>Ümid Hacılı</h1>
<button class="start-button" id="startButton" aria-label="Start">
<span></span>
</button>
</div>
</div>

<div class="screen hidden" id="secondScreen">
<div class="second-screen">
<button class="back-button" id="backButton">← Geri</button>
</div>
</div>

<script>
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
let width,height;

function resizeCanvas(){
width=window.innerWidth;
height=window.innerHeight;
canvas.width=width;
canvas.height=height;
}

resizeCanvas();
window.addEventListener("resize",resizeCanvas);

const particles=[];
const colors=["#00eaff","#008cff","#7a00ff","#ff00cc","#ff0055","#ff7700","#ffe600","#00ff88"];

function createFirework(x,y){
const amount=60;
const color=colors[Math.floor(Math.random()*colors.length)];

for(let i=0;i<amount;i++){
const angle=Math.PI*2*(i/amount)+(Math.random()-.5)*.12;
const speed=1.5+Math.random()*4;
const life=800+Math.random()*500;

particles.push({
x:x,
y:y,
vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed,
size:1.5+Math.random()*2.5,
life:life,
maxLife:life,
color:color
});
}

for(let i=0;i<12;i++){
particles.push({
x:x,
y:y,
vx:(Math.random()-.5)*2,
vy:(Math.random()-.5)*2,
size:2+Math.random()*3,
life:350,
maxLife:350,
color:"#fff"
});
}
}

window.addEventListener("click",function(e){
if(e.target.closest("#startButton"))return;
if(e.target.closest("#backButton"))return;
createFirework(e.clientX,e.clientY);
});

function drawParticle(p){
const opacity=Math.max(0,p.life/p.maxLife);

ctx.globalAlpha=opacity;
ctx.shadowBlur=12;
ctx.shadowColor=p.color;

ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fillStyle=p.color;
ctx.fill();

ctx.globalAlpha=1;
}

let lastTime=performance.now();

function animate(time){
const delta=Math.min(32,time-lastTime);
lastTime=time;

ctx.clearRect(0,0,width,height);

for(let i=particles.length-1;i>=0;i--){
const p=particles[i];

p.x+=p.vx*(delta/16);
p.y+=p.vy*(delta/16);
p.vy+=.045*(delta/16);
p.vx*=.985;
p.vy*=.985;
p.life-=delta;

drawParticle(p);

if(p.life<=0){
particles.splice(i,1);
}
}

requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

const firstScreen=document.getElementById("firstScreen");
const secondScreen=document.getElementById("secondScreen");

function showFirst(){
firstScreen.classList.remove("hidden");
secondScreen.classList.add("hidden");
}

function showSecond(){
firstScreen.classList.add("hidden");
secondScreen.classList.remove("hidden");
}

if(location.hash==="#second"){
history.replaceState({page:"second"},"","#second");
showSecond();
}else{
history.replaceState({page:"first"},"","#home");
showFirst();
}

document.getElementById("startButton").addEventListener("click",function(e){
e.stopPropagation();
history.pushState({page:"second"},"","#second");
showSecond();
});

document.getElementById("backButton").addEventListener("click",function(e){
e.stopPropagation();
history.back();
});

window.addEventListener("popstate",function(){
if(history.state&&history.state.page==="second"){
showSecond();
}else{
showFirst();
}
});
</script>

</body>
</html>
