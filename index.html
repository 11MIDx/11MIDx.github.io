<!DOCTYPE html>
<html lang="az">

<head>

    <!-- Google Search Console -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- SEO -->

    <meta name="description"
          content="11MIDx - Ümid Hacılı tərəfindən hazırlanmış şəxsi veb sayt.">

          content="index, follow">

    <link rel="canonical"
          href="https://11midx.github.io/">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        /* Neon effekt üçün canvas */
        #particles {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 1;
        }

        /* Saytın mərkəzi */
        .container {
            position: relative;

            z-index: 5;

            text-align: center;
        }

        h1 {
            margin: 0 0 25px 0;

            font-family: Arial, sans-serif;

            font-size: 50px;
            font-weight: 600;

            color: white;
        }

        /* Aşağıdakı dairə */
        .loader {
            width: 35px;
            height: 35px;

            margin: auto;

            border: 4px solid #333;
            border-top: 4px solid white;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /* Sol yuxarı ChatGPT yazısı */
        .chatgpt-credit {
            position: fixed;

            top: 15px;
            left: 18px;

            z-index: 10;

            font-family: Arial, sans-serif;

            font-size: 13px;

            color: #777;

            user-select: none;
        }

    </style>

</head>


<body>

    <!-- Sol yuxarı -->
    <div class="chatgpt-credit">
        ✦ ChatGPT
    </div>


    <!-- Neon hissəciklərin canvası -->
    <canvas id="particles"></canvas>


    <!-- Mərkəz -->
    <div class="container">

        <h1>Ümid Hacılı</h1>

        <div class="loader"></div>

    </div>


    <script>

        const canvas =
            document.getElementById("particles");

        const ctx =
            canvas.getContext("2d");


        let width;
        let height;


        function resizeCanvas() {

            width =
                canvas.width =
                window.innerWidth;

            height =
                canvas.height =
                window.innerHeight;

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /*
         * Mouse koordinatları
         */
        let mouseX =
            window.innerWidth / 2;

        let mouseY =
            window.innerHeight / 2;


        /*
         * Neon rənglər
         */
        const colors = [

            "#00eaff",
            "#008cff",
            "#4d00ff",
            "#a000ff",
            "#ff00d4",
            "#ff0055",
            "#ff5c00",
            "#ffe600",
            "#7dff00",
            "#00ff88"

        ];


        /*
         * Bütün hissəciklər burada saxlanılır
         */
        const particles = [];


        /*
         * Mouse hərəkət etdikdə
         */
        window.addEventListener(
            "mousemove",
            function(event) {

                mouseX =
                    event.clientX;

                mouseY =
                    event.clientY;


                /*
                 * Mouse-un arxasınca
                 * xətt çəkmirik.
                 *
                 * Əvəzində mouse-un
                 * ətrafına hissəciklər
                 * püskürür.
                 */

                for (
                    let i = 0;
                    i < 7;
                    i++
                ) {

                    createParticle();

                }

            }
        );


        /*
         * Bir neon hissəcik yarat
         */
        function createParticle() {

            /*
             * Təsadüfi istiqamət
             */
            const angle =
                Math.random() *
                Math.PI *
                2;


            /*
             * Təsadüfi sürət
             */
            const speed =
                0.5 +
                Math.random() * 3.5;


            /*
             * Mouse-un tam üstündən
             * yox, yaxın ətrafından başlasın
             */
            const distance =
                Math.random() * 12;


            const x =
                mouseX +
                Math.cos(angle) *
                distance;


            const y =
                mouseY +
                Math.sin(angle) *
                distance;


            particles.push({

                x: x,
                y: y,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed,

                /*
                 * Böyükdən kiçiyə
                 */
                size:
                    1.5 +
                    Math.random() * 5,

                /*
                 * 0.7-1.2 saniyə
                 * arasında yaşasın
                 */
                life:
                    700 +
                    Math.random() * 500,

                maxLife:
                    700 +
                    Math.random() * 500,

                color:
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ]

            });

        }


        /*
         * Neon hissəcikləri çək
         */
        function drawParticles() {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            /*
             * Hissəciklərin hamısını
             * geriyə doğru yoxlayırıq
             */
            for (
                let i = particles.length - 1;
                i >= 0;
                i--
            ) {

                const p =
                    particles[i];


                /*
                 * Hərəkət
                 */
                p.x += p.vx;

                p.y += p.vy;


                /*
                 * Yavaşlama
                 */
                p.vx *= 0.985;
                p.vy *= 0.985;


                /*
                 * Bir az aşağı-yuxarı
                 * yumşaq hərəkət
                 */
                p.vy += 0.015;


                /*
                 * Vaxt azalır
                 */
                p.life -= 16;


                /*
                 * Şəffaflıq
                 *
                 * Əvvəldə güclü,
                 * sonda yumşaq yox olur.
                 */
                const opacity =
                    Math.max(
                        0,
                        p.life / p.maxLife
                    );


                /*
                 * Ölçü də getdikcə azalır
                 */
                const size =
                    p.size *
                    (0.5 + opacity);


                /*
                 * Neon parıltı
                 */
                ctx.save();

                ctx.globalAlpha =
                    opacity;


                ctx.shadowBlur =
                    20;

                ctx.shadowColor =
                    p.color;


                /*
                 * Yumşaq dairə
                 */
                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    p.color;

                ctx.fill();


                /*
                 * Daha yumşaq ikinci
                 * parıltı qatı
                 */
                ctx.globalAlpha =
                    opacity * 0.25;

                ctx.beginPath();

                ctx.arc(
                    p.x,
                    p.y,
                    size * 3,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    p.color;

                ctx.fill();


                ctx.restore();


                /*
                 * Ömrü bitibsə sil
                 */
                if (
                    p.life <= 0
                ) {

                    particles.splice(
                        i,
                        1
                    );

                }

            }


            /*
             * Animasiya davam etsin
             */
            requestAnimationFrame(
                drawParticles
            );

        }


        /*
         * Animasiya başlasın
         */
        drawParticles();


    </script>

</body>

</html>
