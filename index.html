<!DOCTYPE html>
<html lang="az">
<head>

    <meta name="google-site-verification" content="hWI9JTzJS9M8SbMfd-1oRRcM1X1bAHBEfjEB6a2jXLs">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>11MIDx</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            z-index: 5;
            text-align: center;
        }

        h1 {
            margin: 0 0 25px 0;
            font-family: Arial, sans-serif;
            font-size: 50px;
            color: white;
        }

        .loader {
            width: 35px;
            height: 35px;

            border: 4px solid #333;
            border-top: 4px solid white;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin: auto;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .chatgpt-credit {
            position: fixed;
            top: 15px;
            left: 18px;

            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #777;

            z-index: 10;
        }

        #wave {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>

</head>

<body>

    <div class="chatgpt-credit">
        ✦ ChatGPT
    </div>

    <canvas id="wave"></canvas>

    <div class="container">
        <h1>Ümid Hacılı</h1>
        <div class="loader"></div>
    </div>

    <script>

        const canvas = document.getElementById("wave");
        const ctx = canvas.getContext("2d");

        let width;
        let height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        resize();

        window.addEventListener("resize", resize);

        const points = [];

        let mouseX = 0;
        let mouseY = 0;

        let lastMoveTime = Date.now();

        const colors = [
            "#00eaff",
            "#0077ff",
            "#7a00ff",
            "#ff00cc",
            "#ff0055",
            "#ff7700",
            "#ffee00",
            "#00ff88"
        ];

        document.addEventListener("mousemove", function(e) {

            mouseX = e.clientX;
            mouseY = e.clientY;

            lastMoveTime = Date.now();

            points.push({
                x: mouseX,
                y: mouseY
            });

            if (points.length > 120) {
                points.shift();
            }
        });


        function drawWave() {

            ctx.clearRect(0, 0, width, height);

            const stoppedFor =
                Date.now() - lastMoveTime;

            /*
             * Siçan 0.4 saniyə dayanandan
             * sonra silinmə başlayır.
             */
            let fade = 1;

            if (stoppedFor > 400) {

                /*
                 * 0.2 saniyə ərzində
                 * tamamilə yox olur.
                 */
                fade = Math.max(
                    0,
                    1 - (stoppedFor - 400) / 200
                );
            }

            if (points.length > 3 && fade > 0) {

                ctx.save();

                ctx.globalAlpha = fade;

                for (
                    let wave = 0;
                    wave < 4;
                    wave++
                ) {

                    ctx.beginPath();

                    for (
                        let i = 0;
                        i < points.length;
                        i++
                    ) {

                        const p = points[i];

                        const progress =
                            i / (points.length - 1);

                        const offset =
                            Math.sin(
                                i * 0.35 +
                                wave * 1.5
                            ) *
                            (8 + progress * 12);

                        const x =
                            p.x +
                            Math.cos(i * 0.18) *
                            offset;

                        const y =
                            p.y +
                            Math.sin(i * 0.25) *
                            offset;

                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    }

                    const color =
                        colors[
                            wave % colors.length
                        ];

                    ctx.strokeStyle = color;

                    ctx.lineWidth =
                        2.5 + wave * 1.2;

                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";

                    ctx.shadowBlur = 15;
                    ctx.shadowColor = color;

                    ctx.stroke();
                }

                ctx.restore();
            }

            /*
             * Ən köhnə hissə birinci,
             * ən yeni hissə ən son silinir.
             */
            if (stoppedFor > 600) {
                points.splice(
                    0,
                    Math.max(1, Math.ceil(points.length / 8))
                );
            }

            requestAnimationFrame(drawWave);
        }

        drawWave();

    </script>

</body>
</html>
