<!DOCTYPE html>
<html lang="az">
<head>

    <meta name="google-site-verification" content="hWI9JTzJS9M8SbMfd-1oRRcM1X1bAHBEfjEB6a2jXLs">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>11MIDx</title>

    <style>
        body {
            margin: 0;
            background: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-family: Arial, sans-serif;
            font-size: 50px;
            color: black;
            margin: 0 0 25px 0;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #e5e5e5;
            border-top: 4px solid #222;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .chatgpt-credit {
            position: fixed;
            top: 15px;
            left: 18px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #777;
        }

        #azerbaijan-time {
            margin-top: 5px;
            font-size: 12px;
            color: #999;
        }
    </style>

</head>

<body>

    <div class="chatgpt-credit">
        ✦ ChatGPT
        <div id="azerbaijan-time">Saat yüklənir...</div>
    </div>

    <div class="container">
        <h1>Ümid Hacılı</h1>
        <div class="loader"></div>
    </div>

    <script>
        let serverTime = null;

        async function getAzerbaijanTime() {
            try {
                const response = await fetch(
                    "https://timeapi.io/api/Time/current/zone?timeZone=Asia%2FBaku"
                );

                if (!response.ok) {
                    throw new Error("Vaxt serverinə qoşulmaq olmadı");
                }

                const data = await response.json();

                serverTime = new Date(data.dateTime);

                updateClock();

                setInterval(function () {
                    serverTime.setSeconds(
                        serverTime.getSeconds() + 1
                    );

                    updateClock();
                }, 1000);

            } catch (error) {
                document.getElementById(
                    "azerbaijan-time"
                ).textContent = "Saat alınmadı";
            }
        }

        function updateClock() {
            if (!serverTime) return;

            const hours = String(
                serverTime.getHours()
            ).padStart(2, "0");

            const minutes = String(
                serverTime.getMinutes()
            ).padStart(2, "0");

            const seconds = String(
                serverTime.getSeconds()
            ).padStart(2, "0");

            document.getElementById(
                "azerbaijan-time"
            ).textContent =
                hours + ":" + minutes + ":" + seconds;
        }

        getAzerbaijanTime();
    </script>

</body>
</html>
