
<!DOCTYPE html>
<html lang="az">
<head>

    <meta name="google-site-verification" content="hWI9JTzJS9M8SbMfd-1oRRcM1X1bAHBEfjEB6a2jXLs">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>11MIDx</title>

    <style>
        body {
            margin: 0;
            background: white;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-family: Arial, sans-serif;
            font-size: 50px;
            color: black;
            margin: 0 0 25px 0;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #e5e5e5;
            border-top: 4px solid #222;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .chatgpt-credit {
            position: fixed;
            top: 15px;
            left: 18px;

            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #777;
        }

        #azerbaijan-time {
            margin-top: 5px;
            font-size: 12px;
            color: #999;
        }
    </style>

</head>

<body>

    <div class="chatgpt-credit">
        ✦ ChatGPT
        <div id="azerbaijan-time"></div>
    </div>

    <div class="container">

        <h1>Ümid Hacılı</h1>

        <div class="loader"></div>

    </div>

    <script>
        function updateAzerbaijanTime() {
            const now = new Date();

            const time = now.toLocaleTimeString("az-AZ", {
                timeZone: "Asia/Baku",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });

            document.getElementById("azerbaijan-time").textContent = time;
        }

        updateAzerbaijanTime();
        setInterval(updateAzerbaijanTime, 1000);
    </script>

</body>
</html>
