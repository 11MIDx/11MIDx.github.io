<!DOCTYPE html>
<html lang="az">
<head>

    <meta name="google-site-verification" content="hWI9JTzJS9M8SbMfd-1oRRcM1X1bAHBEfjEB6a2jXLs">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>11MIDx</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: default;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-family: Arial, sans-serif;
            font-size: 50px;
            color: white;
            margin: 0 0 25px 0;
        }

        .loader {
            width: 35px;
            height: 35px;

            border: 4px solid #333;
            border-top: 4px solid white;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin: auto;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .chatgpt-credit {
            position: fixed;
            top: 15px;
            left: 18px;

            font-family: Arial, sans-serif;
            font-size: 13px;

            color: #aaa;

            z-index: 10;
        }

        .trail {
            position: fixed;

            width: 12px;
            height: 12px;

            border-radius: 50%;

            pointer-events: none;

            z-index: 1;

            transform: translate(-50%, -50%);

            animation: fadeTrail 0.8s linear forwards;
        }

        @keyframes fadeTrail {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
        }
    </style>

</head>

<body>

    <div class="chatgpt-credit">
        ✦ ChatGPT
    </div>

    <div class="container">
        <h1>Ümid Hacılı</h1>

        <div class="loader"></div>
    </div>

    <script>

        const colors = [
            "#ff004c",
            "#ff7b00",
            "#ffee00",
            "#00ff66",
            "#00eaff",
            "#0066ff",
            "#9d00ff",
            "#ff00d4"
        ];

        let colorIndex = 0;

        document.addEventListener("mousemove", function(event) {

            const trail = document.createElement("div");

            trail.className = "trail";

            trail.style.left = event.clientX + "px";
            trail.style.top = event.clientY + "px";

            trail.style.background =
                colors[colorIndex];

            trail.style.boxShadow =
                "0 0 15px " + colors[colorIndex];

            document.body.appendChild(trail);

            colorIndex++;

            if (colorIndex >= colors.length) {
                colorIndex = 0;
            }

            setTimeout(function() {
                trail.remove();
            }, 800);

        });

    </script>

</body>
</html>
