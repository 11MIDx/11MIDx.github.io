<!DOCTYPE html>
<html lang="az">
<head>

    <meta name="google-site-verification" content="hWI9JTzJS9M8SbMfd-1oRRcM1X1bAHBEfjEB6a2jXLs">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>11MIDx</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: default;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 5;
        }

        h1 {
            font-family: Arial, sans-serif;
            font-size: 50px;
            color: white;
            margin: 0 0 25px 0;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #333;
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .chatgpt-credit {
            position: fixed;
            top: 15px;
            left: 18px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #aaa;
            z-index: 10;
        }

        #trail-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>

</head>

<body>

    <div class="chatgpt-credit">
        ✦ ChatGPT
    </div>

    <canvas id="trail-canvas"></canvas>

    <div class="container">
        <h1>Ümid Hacılı</h1>
        <div class="loader"></div>
    </div>

    <script>
        const canvas = document.getElementById("trail-canvas");
        const ctx = canvas.getContext("2d");

        let width;
        let height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        resizeCanvas();

        window.addEventListener("resize", resizeCanvas);

        const points = [];

        const colors = [
            "#ff0055",
            "#ff7b00",
            "#ffee00",
            "#00ff66",
            "#00eaff",
            "#0066ff",
            "#9d00ff",
            "#ff00d4"
        ];

        let colorPosition = 0;

        document.addEventListener("mousemove", function(event) {

            points.push({
                x: event.clientX,
                y: event.clientY,
                color: colorPosition
            });

            colorPosition += 0.08;

            if (points.length > 45) {
                points.shift();
            }
        });

        function drawTrail() {

            ctx.clearRect(0, 0, width, height);

            if (points.length > 1) {

                for (let i = 1; i < points.length; i++) {

                    const previous = points[i - 1];
                    const current = points[i];

                    const progress = i / points.length;

                    const colorIndex =
                        Math.floor(
                            (current.color + i * 0.12) %
                            colors.length
                        );

                    ctx.beginPath();

                    ctx.moveTo(
                        previous.x,
                        previous.y
                    );

                    ctx.lineTo(
                        current.x,
                        current.y
                    );

                    ctx.lineWidth =
                        2 + progress * 8;

                    ctx.lineCap = "round";

                    ctx.strokeStyle =
                        colors[colorIndex];

                    ctx.globalAlpha =
                        progress * 0.8;

                    ctx.shadowBlur = 12;

                    ctx.shadowColor =
                        colors[colorIndex];

                    ctx.stroke();
                }
            }

            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            requestAnimationFrame(drawTrail);
        }

        drawTrail();
    </script>

</body>
</html>
